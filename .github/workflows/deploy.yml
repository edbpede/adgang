name: Deploy to GitHub Pages
on:
  workflow_dispatch:
    inputs:
      expected-default-sha:
        description: Exact default-branch commit requested after a checked merge
        type: string
        default: ''
permissions:
  contents: write
  actions: read
concurrency:
  group: pages-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: edbfi/automation/actions/dispatch-guard@v1.0.0
        with:
          token: ${{ github.token }}
          expected-default-sha: ${{ inputs.expected-default-sha || github.sha }}
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Find successful CI for this exact commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&branch=main" > /tmp/runs.json
          python3 - <<'PYTHON'
          import json, os
          runs = json.load(open('/tmp/runs.json'))['workflow_runs']
          final = next((r for r in runs if r['event'] in {'push', 'workflow_dispatch'}), None)
          if not (final and final['head_sha'] == os.environ['GITHUB_SHA'] and final['head_branch'] == 'main' and final['status'] == 'completed' and final['conclusion'] == 'success'):
              raise SystemExit('Exact main commit has no successful final CI')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"run-id={final['id']}\n")
          PYTHON
      - name: Use the validated build
        uses: actions/download-artifact@v8.0.1
        with:
          name: site-dist
          path: dist/
          run-id: ${{ steps.ci.outputs.run-id }}
          github-token: ${{ github.token }}
      - uses: edbfi/automation/actions/dispatch-guard@v1.0.0
        with:
          token: ${{ github.token }}
          expected-default-sha: ${{ inputs.expected-default-sha || github.sha }}
      - uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ github.token }}
          publish_dir: ./dist
          cname: portaler.edb.fi
