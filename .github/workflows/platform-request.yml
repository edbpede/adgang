name: Process New Platform Request
'on':
  issues:
    types:
    - opened
permissions:
  contents: read
concurrency:
  group: platform-request-${{ github.event.issue.number }}
  cancel-in-progress: false
jobs:
  check-conditions:
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
    - name: Check Conditions and Close Issue if Failed
      uses: actions/github-script@v9.0.0
      with:
        script: "const isPlatformRequest = context.payload.issue.labels.some(label => label.name === 'platform-request');\n\
          const isCorrectUser = context.payload.issue.user.login === 'edbfi';\n\nif (!isPlatformRequest)\
          \ {\n  console.log('Not a platform request, skipping checks');\n  return;\n}\n\nif (!isCorrectUser)\
          \ {\n  console.log('Incorrect user detected');\n  const errorBody = [\n    '## \u274C Ugyldig\
          \ Anmodning',\n    '',\n    '### Fejl',\n    'Kun brugeren \"edbfi\" kan oprette platformanmodninger.',\n\
          \    '',\n    '### N\xE6ste Trin',\n    '1. Kontakt venligst administratoren, hvis du mener\
          \ dette er en fejl',\n    '2. Denne sag vil nu blive lukket'\n  ].join('\\n');\n\n  await github.rest.issues.createComment({\n\
          \    owner: context.repo.owner,\n    repo: context.repo.repo,\n    issue_number: context.issue.number,\n\
          \    body: errorBody\n  });\n\n  await github.rest.issues.update({\n    owner: context.repo.owner,\n\
          \    repo: context.repo.repo,\n    issue_number: context.issue.number,\n    state: 'closed',\n\
          \    state_reason: 'completed'\n  });\n\n  core.setFailed('Invalid user attempted to create\
          \ platform request');\n}\n"
    timeout-minutes: 5
  create-platform:
    needs: check-conditions
    if: github.event.issue.user.login == 'edbfi' && contains(github.event.issue.labels.*.name, 'platform-request')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        ref: ${{ github.event.repository.default_branch }}
        persist-credentials: false
    - uses: actions/setup-node@v7.0.0
      with:
        node-version: 24.20.0
    - uses: oven-sh/setup-bun@v2.2.0
      with:
        bun-version-file: package.json
    - run: bun install --frozen-lockfile
    - name: Parse, validate and create platform data
      id: request
      run: bun run scripts/platform-request.ts
    - name: Format the generated platform only
      env:
        REQUEST_PATH: ${{ steps.request.outputs.path }}
      run: bunx biome check --write "$REQUEST_PATH"
    - name: Propose checked catalog addition
      id: platform
      uses: peter-evans/create-pull-request@v8.1.1
      with:
        token: ${{ github.token }}
        base: ${{ github.event.repository.default_branch }}
        branch: feat/platform-request-${{ github.event.issue.number }}
        add-paths: ${{ steps.request.outputs.path }}
        commit-message: 'feat(platform): add requested learning platform'
        signoff: true
        title: 'feat(platform): add requested learning platform'
        body: |-
          Add the learning platform requested in #${{ github.event.issue.number }}. The parser validates owner, fields, subjects, grades, duplicate names/URLs and destination paths. Full CI is dispatched for this exact commit.

          Closes #${{ github.event.issue.number }}
    - name: Validate the exact platform PR commit
      if: steps.platform.outputs.pull-request-number != ''
      env:
        GH_TOKEN: ${{ github.token }}
        PLATFORM_PR: ${{ steps.platform.outputs.pull-request-number }}
        PLATFORM_SHA: ${{ steps.platform.outputs.pull-request-head-sha }}
        PLATFORM_BRANCH: feat/platform-request-${{ github.event.issue.number }}
      run: |
        set -euo pipefail
        for attempt in 1 2 3; do
          if gh workflow run ci.yml --ref "$PLATFORM_BRANCH" \
            -f pr-number="$PLATFORM_PR" -f expected-head-sha="$PLATFORM_SHA"; then
            exit 0
          fi
          sleep "$((attempt * 2))"
        done
        echo "::error::CI dispatch failed. Run ci.yml on $PLATFORM_BRANCH with pr-number=$PLATFORM_PR and expected-head-sha=$PLATFORM_SHA."
        exit 1
